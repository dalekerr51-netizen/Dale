<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniExpense | College Expense Tracker</title>
  <!-- Google Fonts & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(22, 30, 46, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-glow: rgba(139, 92, 246, 0.25);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* Background Ambient Glows */
    .glow-1, .glow-2 {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      z-index: -1;
      opacity: 0.5;
      animation: pulse 8s ease-in-out infinite alternate;
    }
    .glow-1 {
      top: -100px;
      left: -100px;
      width: 450px;
      height: 450px;
      background: var(--accent-purple);
    }
    .glow-2 {
      bottom: -100px;
      right: -100px;
      width: 500px;
      height: 500px;
      background: var(--accent-cyan);
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.4; }
      100% { transform: scale(1.15); opacity: 0.6; }
    }

    header {
      padding: 2rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.4rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 30%, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .container {
      max-width: 1100px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
      width: 100%;
    }

    .hero {
      text-align: center;
      margin-bottom: 3rem;
      animation: fadeInDown 0.8s ease;
    }

    .hero h1 {
      font-size: 2.8rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* Dashboard Summary Cards */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 1.5rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(139, 92, 246, 0.4);
      box-shadow: 0 12px 40px var(--accent-glow);
    }

    .card-title {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-amount {
      font-size: 2rem;
      font-weight: 700;
    }

    /* Main Content Layout */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 2rem;
    }

    @media (max-width: 768px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    /* Input Form Styles */
    form {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    input, select {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent-purple);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    option {
      background-color: #0f172a;
      color: var(--text-main);
    }

    .btn-submit {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-submit:active { transform: translateY(0); }

    /* Expense List Styles */
    .expense-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 0.3rem;
    }

    .expense-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      animation: fadeIn 0.4s ease forwards;
    }

    .expense-info h4 {
      font-size: 1rem;
      font-weight: 600;
    }

    .expense-info p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .expense-amount {
      font-weight: 700;
      font-size: 1.1rem;
      color: #f43f5e;
    }

    .tag {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      margin-top: 0.25rem;
      background: rgba(139, 92, 246, 0.15);
      color: var(--accent-purple);
      border: 1px solid rgba(139, 92, 246, 0.3);
    }

    /* Keyframe Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <header>
    <div class="logo">
      <i data-lucide="graduation-cap"></i>
      <span>UniExpense</span>
    </div>
  </header>

  <div class="container">
    <div class="hero">
      <h1>Master Your Student Budget</h1>
      <p>Organize tuition, food, living costs, and supplies in one place.</p>
    </div>

    <!-- Summary Metrics -->
    <div class="summary-grid">
      <div class="card">
        <div class="card-title"><i data-lucide="wallet"></i> Total Spent</div>
        <div class="card-amount" id="totalSpent">$0.00</div>
      </div>
      <div class="card">
        <div class="card-title"><i data-lucide="book-open"></i> Tuition & Books</div>
        <div class="card-amount" id="academicSpent">$0.00</div>
      </div>
      <div class="card">
        <div class="card-title"><i data-lucide="utensils"></i> Food Expenses</div>
        <div class="card-amount" id="foodSpent">$0.00</div>
      </div>
      <div class="card">
        <div class="card-title"><i data-lucide="home"></i> Rent & Utilities</div>
        <div class="card-amount" id="housingSpent">$0.00</div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-grid">
      <!-- Form Section -->
      <div class="card">
        <h3 style="margin-bottom: 1.2rem;">Add New Expense</h3>
        <form id="expenseForm">
          <div class="input-group">
            <label for="title">Title / Description</label>
            <input type="text" id="title" placeholder="e.g. Physics Textbook, Trader Joe's" required />
          </div>
          <div class="input-group">
            <label for="amount">Amount ($)</label>
            <input type="number" id="amount" step="0.01" placeholder="49.99" required />
          </div>
          <div class="input-group">
            <label for="category">Category</label>
            <select id="category">
              <option value="Tuition and Fees">Tuition and Fees</option>
              <option value="Rent">Rent</option>
              <option value="Books and Supplies">Books and Supplies</option>
              <option value="Groceries">Groceries</option>
              <option value="On Campus Food">On Campus Food</option>
              <option value="Food Out">Food Out</option>
              <option value="Utilities">Utilities</option>
            </select>
          </div>
          <button type="submit" class="btn-submit">
            <i data-lucide="plus-circle"></i> Add Expense
          </button>
        </form>
      </div>

      <!-- Log Section -->
      <div class="card">
        <h3 style="margin-bottom: 1.2rem;">Recent Expenses</h3>
        <div class="expense-list" id="expenseList">
          <p id="emptyState" style="color: var(--text-muted); text-align: center; padding: 2rem 0;">No expenses added yet. Add your first item on the left!</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Initialize Icons
    lucide.createIcons();

    // Data State
    let expenses = [];

    // DOM Elements
    const form = document.getElementById('expenseForm');
    const list = document.getElementById('expenseList');
    const emptyState = document.getElementById('emptyState');
    const totalSpentEl = document.getElementById('totalSpent');
    const academicSpentEl = document.getElementById('academicSpent');
    const foodSpentEl = document.getElementById('foodSpent');
    const housingSpentEl = document.getElementById('housingSpent');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const title = document.getElementById('title').value;
      const amount = parseFloat(document.getElementById('amount').value);
      const category = document.getElementById('category').value;

      const expense = { id: Date.now(), title, amount, category, date: new Date().toLocaleDateString() };
      expenses.unshift(expense);
      
      form.reset();
      updateUI();
    });

    function updateUI() {
      // Toggle empty state
      if (expenses.length > 0) {
        emptyState.style.display = 'none';
      }

      // Render items
      list.innerHTML = '';
      let total = 0;
      let academic = 0;
      let food = 0;
      let housing = 0;

      expenses.forEach(item => {
        total += item.amount;
        
        // Sum category groups for cards
        if (item.category === 'Tuition and Fees' || item.category === 'Books and Supplies') {
          academic += item.amount;
        }
        if (item.category === 'Groceries' || item.category === 'On Campus Food' || item.category === 'Food Out') {
          food += item.amount;
        }
        if (item.category === 'Rent' || item.category === 'Utilities') {
          housing += item.amount;
        }

        const el = document.createElement('div');
        el.className = 'expense-item';
        el.innerHTML = `
          <div class="expense-info">
            <h4>${item.title}</h4>
            <p>${item.date}</p>
            <span class="tag">${item.category}</span>
          </div>
          <div class="expense-amount">-$${item.amount.toFixed(2)}</div>
        `;
        list.appendChild(el);
      });

      // Update Summary Cards
      totalSpentEl.textContent = `$${total.toFixed(2)}`;
      academicSpentEl.textContent = `$${academic.toFixed(2)}`;
      foodSpentEl.textContent = `$${food.toFixed(2)}`;
      housingSpentEl.textContent = `$${housing.toFixed(2)}`;
    }
  </script>
</body>
</html>
